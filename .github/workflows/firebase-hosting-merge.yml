# Deploys main to the Firebase Hosting live channel after each merge.
# Generated by `firebase init hosting:github` and adapted (D35).

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci && npm run build

      # Pinned to a commit because the action receives the service account key (v0.11.0).
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHELFMARK_BD1A8 }}
          channelId: live
          projectId: shelfmark-bd1a8
