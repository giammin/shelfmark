# Deploys each pull request to a Firebase Hosting preview channel and comments the URL on the PR.
# Generated by `firebase init hosting:github` and adapted (D35).
# The pull request code is built in a job without secrets; the deploy job receives the service
# account key but only runs trusted configuration from the base branch and the built artifact.

name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read

concurrency:
  group: hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job names must differ from the required CI check `build`.
  preview-build:
    # Secrets are not available to pull requests from forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/shelfmark/browser
          retention-days: 1

  preview-deploy:
    needs: preview-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      # firebase.json from the base branch: it can define predeploy commands.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/shelfmark/browser

      # Pinned to a commit because the action receives the service account key (v0.11.0).
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHELFMARK_BD1A8 }}
          projectId: shelfmark-bd1a8
